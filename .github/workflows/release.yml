name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.5.0)'
        required: true
        type: string

jobs:
  # Build a "fat" source tarball that includes the vendor/link git submodule.
  # GitHub's auto-generated archives omit submodule contents, so we produce our
  # own tarball and upload it as a release artifact.  The Homebrew formula uses
  # this tarball as its `url` so that the Ableton Link SDK is available during
  # `brew install --build-from-source`.
  build-homebrew-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Create fat source tarball
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          STAGING="wail-${VERSION}"
          # Export the repo tree (excludes .git) into a named staging directory
          mkdir -p "/tmp/${STAGING}"
          git archive --format=tar HEAD | tar -x -C "/tmp/${STAGING}"
          # Overlay the submodule contents (git archive omits them)
          cp -r vendor/link "/tmp/${STAGING}/vendor/link"
          # Package and compute checksum
          tar -czf "wail-${VERSION}-src.tar.gz" -C /tmp "${STAGING}"
          sha256sum "wail-${VERSION}-src.tar.gz" | awk '{print $1}' > "wail-${VERSION}-src.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: wail-homebrew-src
          path: |
            wail-*-src.tar.gz
            wail-*-src.tar.gz.sha256

  build-windows:
    # Pinned to windows-2022 (older MinGW GCC + CMake) rather than
    # windows-latest, which rolled over to the 2025/2026 image. That newer
    # image's MinGW GCC rejects the Ableton Link 4.0 beta headers compiled by
    # the Go/CGo desktop-app build (the same headers compile cleanly on the
    # Linux runner's GCC 11). See #329.
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version-file: wail-app/go.mod

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          # Bump the suffix whenever the package list below changes, otherwise a
          # stale cache is restored and the new packages are never installed.
          key: vcpkg-opus-rtmidi-pkgconf-x64-windows-v2

      - name: Install opus + rtmidi + pkgconf via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        # pkgconf is a drop-in pkg-config that the Go/CGo build needs to locate
        # opus and rtmidi. We get it from vcpkg rather than choco because the
        # choco community feed is flaky (504s) and silently leaves the build to
        # fall back to Strawberry Perl's broken pkg-config.bat stub on PATH.
        run: vcpkg install opus:x64-windows rtmidi:x64-windows pkgconf:x64-windows

      - name: Configure pkg-config
        shell: pwsh
        # Point CGo straight at the vcpkg pkgconf binary by absolute path via
        # PKG_CONFIG, so PATH lookup (and Strawberry Perl's pkg-config.bat stub)
        # is bypassed entirely for every later step in this job.
        run: |
          $pkgconf = Get-ChildItem C:\vcpkg\installed\x64-windows -Recurse -Filter pkgconf.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkgconf) { throw "pkgconf.exe not found under vcpkg (did the install step run?)" }
          "PKG_CONFIG=$($pkgconf.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using PKG_CONFIG=$($pkgconf.FullName)"
          & $pkgconf.FullName --version

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        env:
          PKG_CONFIG_PATH: C:\vcpkg\installed\x64-windows\lib\pkgconfig
          # Belt-and-suspenders for CMake 4.x: audiopus_sys builds a vendored
          # Opus from source via CMake on Windows (pkg-config is compiled out
          # for the MSVC target), and that Opus declares
          # cmake_minimum_required(<3.5), which CMake 4.x refuses. windows-2022
          # currently ships CMake 3.x so this is a no-op there, but it keeps the
          # build green if the image's CMake is ever bumped.
          # Tracked follow-up (link the prebuilt vcpkg Opus instead): #329
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo xtask bundle-plugin

      - name: Clone abletonlink-go
        shell: bash
        run: git clone --recursive https://github.com/DatanoiseTV/abletonlink-go.git "$RUNNER_TEMP/abletonlink-go"

      - name: Patch Link beta header for MinGW GCC
        shell: bash
        # The Ableton Link 4.0 beta vendored by abletonlink-go has two name
        # collisions in link_audio/Channels.hpp that only bite the MinGW GCC on
        # the Windows runners — Linux GCC 11 compiles the same headers cleanly:
        #
        #   1. The SendHandler constructor parameter `endpoint` shadows the
        #      member function `endpoint()`. By the standard the parameter wins
        #      inside the initializer, but MinGW GCC mis-resolves it to the
        #      member function ("unresolved overloaded function type"). Rename
        #      only the parameter and its use — never the `endpoint()` member.
        #
        #   2. The SendHandler parameter / local variable named `interface`
        #      collides with the Windows `interface` macro (objbase.h defines
        #      `#define interface struct`), pulled in transitively via asio's
        #      winsock headers. The preprocessor rewrites the identifier and the
        #      build fails with "expected identifier before ')' token". Rename
        #      every lowercase `interface` identifier to `iface`; the
        #      word-boundary match leaves the `Interface` template type and the
        #      `mpInterface` member untouched.
        #
        # See #329.
        run: |
          f="$RUNNER_TEMP/abletonlink-go/vendor/link/include/ableton/link_audio/Channels.hpp"
          sed -i \
            -e 's/SendHandler(discovery::UdpEndpoint endpoint,/SendHandler(discovery::UdpEndpoint ep,/' \
            -e 's/: mEndpoint(endpoint)/: mEndpoint(ep)/' \
            -e 's/\binterface\b/iface/g' \
            "$f"
          grep -q "SendHandler(discovery::UdpEndpoint ep, std::shared_ptr<Interface> iface)" "$f" \
            || { echo "Channels.hpp endpoint/interface patch did not apply"; exit 1; }

      - name: Build wail desktop app
        shell: bash
        env:
          PKG_CONFIG_PATH: C:\vcpkg\installed\x64-windows\lib\pkgconfig
        working-directory: wail-app
        run: |
          REPLACE_PATH="${RUNNER_TEMP//\\//}/abletonlink-go"
          sed -i "s|^replace github.com/DatanoiseTV/abletonlink-go.*|replace github.com/DatanoiseTV/abletonlink-go => $REPLACE_PATH|" go.mod
          go build -tags nolibopusfile -ldflags "-X main.appVersion=${{ steps.version.outputs.value }}" -o "$GITHUB_WORKSPACE/dist/bin/wail.exe" .

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p dist/lib
          cp target/bundled/wail-plugin-send.clap dist/lib/
          cp -r target/bundled/wail-plugin-send.vst3 dist/lib/
          cp target/bundled/wail-plugin-recv.clap dist/lib/
          cp -r target/bundled/wail-plugin-recv.vst3 dist/lib/
          cp /c/vcpkg/installed/x64-windows/bin/opus.dll dist/lib/opus.dll
          cp dist/lib/opus.dll dist/lib/wail-plugin-send.vst3/Contents/x86_64-win/
          cp dist/lib/opus.dll dist/lib/wail-plugin-recv.vst3/Contents/x86_64-win/
          # rtmidi.dll is required at runtime by abletonlink-go's CGo bindings.
          # Drop it next to wail.exe so Windows finds it on the default DLL search path.
          cp /c/vcpkg/installed/x64-windows/bin/rtmidi.dll dist/bin/rtmidi.dll
          cat > dist/README.txt <<'EOF'
          WAIL — WAN Audio Interchange for Link

          Run:
            bin\wail.exe

          On first launch the CLAP/VST3 plugins in lib/ are copied to
          %LOCALAPPDATA%\Programs\Common\CLAP and
          %LOCALAPPDATA%\Programs\Common\VST3 so your DAW can find them.
          (No admin rights required.)

          Note: this binary is unsigned. If Windows SmartScreen blocks
          launch, click "More info" then "Run anyway".

          Documentation: https://github.com/MostDistant/WAIL
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: wail-release-windows
          path: dist\

  build-linux:
    runs-on: ubuntu-22.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version-file: wail-app/go.mod

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libopus-dev \
            librtmidi-dev \
            libgl-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            cmake \
            g++

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: cargo xtask bundle-plugin

      - name: Clone abletonlink-go
        run: git clone --recursive https://github.com/DatanoiseTV/abletonlink-go.git "$RUNNER_TEMP/abletonlink-go"

      - name: Build wail desktop app
        run: |
          sed -i "s|^replace github.com/DatanoiseTV/abletonlink-go.*|replace github.com/DatanoiseTV/abletonlink-go => $RUNNER_TEMP/abletonlink-go|" go.mod
          go build -tags nolibopusfile -ldflags "-X main.appVersion=${{ steps.version.outputs.value }}" -o "$GITHUB_WORKSPACE/dist/bin/wail" .
        working-directory: wail-app

      - name: Stage release artifacts
        run: |
          mkdir -p dist/lib
          cp target/bundled/wail-plugin-send.clap dist/lib/
          cp -r target/bundled/wail-plugin-send.vst3 dist/lib/
          cp target/bundled/wail-plugin-recv.clap dist/lib/
          cp -r target/bundled/wail-plugin-recv.vst3 dist/lib/
          cat > dist/README.txt <<'EOF'
          WAIL — WAN Audio Interchange for Link

          Runtime dependencies (Debian/Ubuntu):
            sudo apt install libwebkit2gtk-4.1-0 libopus0 librtmidi6

          Run:
            ./bin/wail

          On first launch the CLAP/VST3 plugins in lib/ are copied to
          ~/.clap/ and ~/.vst3/ so your DAW can find them.

          Documentation: https://github.com/MostDistant/WAIL
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: wail-release-linux
          path: dist/

  create-release:
    needs: [build-windows, build-linux, build-homebrew-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: source
          sparse-checkout: homebrew

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package platform artifacts
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # Windows: zip, with a top-level wail-<version>/ directory inside.
          mv wail-release-windows "wail-${VERSION}"
          zip -r "wail-windows-x64-${VERSION}.zip" "wail-${VERSION}"
          mv "wail-${VERSION}" wail-release-windows
          # Linux: tarball, same top-level directory layout.
          mv wail-release-linux "wail-${VERSION}"
          tar -czf "wail-linux-x64-${VERSION}.tar.gz" "wail-${VERSION}"
          mv "wail-${VERSION}" wail-release-linux

      - name: Find individual installers
        id: files
        run: |
          echo "src_tarball=$(ls wail-homebrew-src/wail-*-src.tar.gz 2>/dev/null | head -1 || true)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            wail-windows-x64-${{ steps.tag.outputs.version }}.zip
            wail-linux-x64-${{ steps.tag.outputs.version }}.tar.gz
            ${{ steps.files.outputs.src_tarball }}

      # Update the Homebrew tap formula with the new version and SHA256.
      # Requires a HOMEBREW_TAP_TOKEN secret with push access to MostDistant/homebrew-wail.
      # If the secret is not configured, this step is skipped gracefully.
      - name: Update Homebrew tap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -z "${GH_TOKEN}" ] && echo "HOMEBREW_TAP_TOKEN not set, skipping tap update." && exit 0
          VERSION="${{ steps.tag.outputs.version }}"
          SHA=$(cat wail-homebrew-src/wail-*-src.tar.gz.sha256 | head -1)
          URL="https://github.com/MostDistant/WAIL/releases/download/v${VERSION}/wail-${VERSION}-src.tar.gz"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/MostDistant/homebrew-wail.git" tap
          # Copy full formula from source so all formula changes are deployed
          cp source/homebrew/wail.rb tap/Formula/wail.rb
          # Patch URL and SHA for this release
          sed -i \
            "s|url \".*\"|url \"${URL}\"|" \
            tap/Formula/wail.rb
          sed -i \
            "s|sha256 \".*\"|sha256 \"${SHA}\"|" \
            tap/Formula/wail.rb
          cd tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "Update wail to v${VERSION}"
          git push
