name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.5.0)'
        required: true
        type: string

jobs:
  # Build a "fat" source tarball that includes the vendor/link git submodule.
  # GitHub's auto-generated archives omit submodule contents, so we produce our
  # own tarball and upload it as a release artifact.  The Homebrew formula uses
  # this tarball as its `url` so that the Ableton Link SDK is available during
  # `brew install --build-from-source`.
  build-homebrew-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Create fat source tarball
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          STAGING="wail-${VERSION}"
          # Export the repo tree (excludes .git) into a named staging directory
          mkdir -p "/tmp/${STAGING}"
          git archive --format=tar HEAD | tar -x -C "/tmp/${STAGING}"
          # Overlay the submodule contents. git archive emits the gitlink as an
          # empty vendor/link/ directory, so copy the submodule's *contents* into
          # it — `cp -r vendor/link dest/vendor/link` would nest them one level
          # too deep (vendor/link/link/), breaking the cgo include paths.
          mkdir -p "/tmp/${STAGING}/vendor/link"
          cp -R vendor/link/. "/tmp/${STAGING}/vendor/link/"
          # Fail loudly if the headers the cgo binding needs aren't where
          # wail-app/internal/abllink expects them.
          test -f "/tmp/${STAGING}/vendor/link/extensions/abl_link/include/abl_link.h"
          test -d "/tmp/${STAGING}/vendor/link/modules/asio-standalone/asio/include"
          # Package and compute checksum
          tar -czf "wail-${VERSION}-src.tar.gz" -C /tmp "${STAGING}"
          sha256sum "wail-${VERSION}-src.tar.gz" | awk '{print $1}' > "wail-${VERSION}-src.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: wail-homebrew-src
          path: |
            wail-*-src.tar.gz
            wail-*-src.tar.gz.sha256

  # build-windows: DISABLED DURING ITERATION (mac only for now)
  # build-windows:
  #   runs-on: windows-2022
  #   steps: ...
  #     (disabled to speed up release pipeline during active development)

  # build-linux: DISABLED DURING ITERATION (mac only for now)
  # build-linux:
  #   runs-on: ubuntu-22.04
  #   steps: ...
  #     (disabled to speed up release pipeline during active development)

  create-release:
    needs: [build-homebrew-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: source
          sparse-checkout: homebrew

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package platform artifacts
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # Note: Windows and Linux builds disabled during iteration (mac only)
          echo "Skipping Windows/Linux packaging during iteration"

      - name: Find individual installers
        id: files
        run: |
          echo "src_tarball=$(ls wail-homebrew-src/wail-*-src.tar.gz 2>/dev/null | head -1 || true)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            ${{ steps.files.outputs.src_tarball }}

      # Update the Homebrew tap formula with the new version and SHA256.
      # Requires a HOMEBREW_TAP_TOKEN secret with push access to MostDistant/homebrew-wail.
      # If the secret is not configured, this step is skipped gracefully.
      - name: Update Homebrew tap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -z "${GH_TOKEN}" ] && echo "HOMEBREW_TAP_TOKEN not set, skipping tap update." && exit 0
          VERSION="${{ steps.tag.outputs.version }}"
          SHA=$(cat wail-homebrew-src/wail-*-src.tar.gz.sha256 | head -1)
          URL="https://github.com/MostDistant/WAIL/releases/download/v${VERSION}/wail-${VERSION}-src.tar.gz"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/MostDistant/homebrew-wail.git" tap
          # Copy full formula from source so all formula changes are deployed
          cp source/homebrew/wail.rb tap/Formula/wail.rb
          # Patch URL and SHA for this release
          sed -i \
            "s|url \".*\"|url \"${URL}\"|" \
            tap/Formula/wail.rb
          sed -i \
            "s|sha256 \".*\"|sha256 \"${SHA}\"|" \
            tap/Formula/wail.rb
          cd tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "Update wail to v${VERSION}"
          git push
