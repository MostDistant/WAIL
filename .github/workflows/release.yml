name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.5.0)'
        required: true
        type: string

jobs:
  # Build a "fat" source tarball that includes the vendor/link and vendor/clap
  # git submodules. GitHub's auto-generated archives omit submodule contents, so
  # we produce our own tarball and upload it as a release artifact. The Homebrew
  # formula uses this tarball as its `url` so that the Ableton Link SDK (cgo
  # binding) and the CLAP headers (plugins/ cmake build) are available during
  # `brew install --build-from-source`.
  build-homebrew-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Create fat source tarball
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          STAGING="wail-${VERSION}"
          # Export the repo tree (excludes .git) into a named staging directory
          mkdir -p "/tmp/${STAGING}"
          git archive --format=tar HEAD | tar -x -C "/tmp/${STAGING}"
          # Overlay the submodule contents. git archive emits the gitlinks as
          # empty vendor/link/ and vendor/clap/ directories, so copy each
          # submodule's *contents* into it — `cp -r vendor/link dest/vendor/link`
          # would nest them one level too deep (vendor/link/link/), breaking the
          # cgo include paths.
          mkdir -p "/tmp/${STAGING}/vendor/link" "/tmp/${STAGING}/vendor/clap"
          cp -R vendor/link/. "/tmp/${STAGING}/vendor/link/"
          cp -R vendor/clap/. "/tmp/${STAGING}/vendor/clap/"
          # Fail loudly if the headers the cgo binding needs aren't where
          # wail-app/internal/abllink expects them, or if the CLAP headers the
          # plugins/ cmake build needs are missing (the Homebrew formula builds
          # the plugins from this tarball).
          test -f "/tmp/${STAGING}/vendor/link/extensions/abl_link/include/abl_link.h"
          test -d "/tmp/${STAGING}/vendor/link/modules/asio-standalone/asio/include"
          test -f "/tmp/${STAGING}/vendor/clap/include/clap/clap.h"
          # Package and compute checksum
          tar -czf "wail-${VERSION}-src.tar.gz" -C /tmp "${STAGING}"
          sha256sum "wail-${VERSION}-src.tar.gz" | awk '{print $1}' > "wail-${VERSION}-src.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: wail-homebrew-src
          path: |
            wail-*-src.tar.gz
            wail-*-src.tar.gz.sha256

  build-windows:
    # Pinned to windows-2022 (older MinGW GCC + CMake) rather than
    # windows-latest, which rolled over to the 2025/2026 image. That newer
    # image's MinGW GCC rejects the Ableton Link 4.0 beta headers compiled by
    # the Go/CGo desktop-app build (the same headers compile cleanly on the
    # Linux runner's GCC 11). See #329.
    runs-on: windows-2022
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: wail-app/go.mod
          # Both Go modules live in subdirs, so point the built-in cache at every
          # go.sum — otherwise setup-go looks only at the repo root and warns.
          cache-dependency-path: "**/go.sum"

      # Reuse the heavy CGo C++ (Ableton Link + asio) compile across runs, even
      # when GOCACHE misses. Routed in via CC/CXX on the build step below.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        continue-on-error: true
        with:
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 500M

      # cgo uses ccache only if it actually installed; otherwise CC/CXX stay
      # unset and cgo falls back to the default gcc/g++ (slower, but still green).
      # The action downloads a binary each run, so a network blip must not fail CI.
      - name: Enable ccache for cgo if available
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "CC=ccache gcc" >> "$GITHUB_ENV"
            echo "CXX=ccache g++" >> "$GITHUB_ENV"
            echo "cgo will use ccache"
          else
            echo "ccache unavailable — building without compiler cache"
          fi

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          # Exact key; bump the suffix when the package list changes. restore-keys
          # falls back to the newest prior cache on a miss, and the install step
          # below still re-runs on a non-exact hit (its `if` checks the exact key).
          key: vcpkg-opus-mingw-static-pkgconf-x64-windows-v5
          restore-keys: |
            vcpkg-opus-mingw-static-pkgconf-x64-windows-

      - name: Install opus + pkgconf via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: bash
        # pkgconf is a drop-in pkg-config that the Go/CGo build needs to locate
        # opus. We get it from vcpkg rather than choco because the choco
        # community feed is flaky (504s) and silently leaves the build to fall
        # back to Strawberry Perl's broken pkg-config.bat stub on PATH.
        #
        # opus is built for the x64-mingw-static triplet (same GCC ABI as the
        # CGo objects) so it links statically into the desktop-app binary.
        run: |
          gcc --version  # the x64-mingw-static triplet builds with this GCC
          vcpkg install \
            pkgconf:x64-windows \
            opus:x64-mingw-static

      - name: Configure pkg-config
        shell: pwsh
        # Point CGo straight at the vcpkg pkgconf binary by absolute path via
        # PKG_CONFIG, so PATH lookup (and Strawberry Perl's pkg-config.bat stub)
        # is bypassed entirely for every later step in this job.
        run: |
          $pkgconf = Get-ChildItem C:\vcpkg\installed\x64-windows -Recurse -Filter pkgconf.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkgconf) { throw "pkgconf.exe not found under vcpkg (did the install step run?)" }
          "PKG_CONFIG=$($pkgconf.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using PKG_CONFIG=$($pkgconf.FullName)"
          & $pkgconf.FullName --version

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Rename Link `interface` param for MinGW
        shell: bash
        # MinGW's COM headers #define `interface`, colliding with the `interface`
        # parameter in Link's link_audio/Channels.hpp. Rename that identifier (the
        # only real use; Interface/mpInterface are untouched by \b).
        run: sed -i 's/\binterface\b/iface/g' vendor/link/include/ableton/link_audio/Channels.hpp

      - name: Build wail desktop app
        shell: bash
        env:
          # opus for the CGo link comes from the MinGW (x64-mingw-static) prefix
          # so its ABI matches the GCC that compiles the CGo objects. Windows
          # system libs (ws2_32, winmm, iphlpapi) are set via cgo LDFLAGS in the
          # abllink package. libstdc++ stays dynamic; the runtime DLLs are shipped
          # in the staging step below.
          PKG_CONFIG_PATH: C:\vcpkg\installed\x64-mingw-static\lib\pkgconfig
        working-directory: wail-app
        run: go build -tags nolibopusfile -ldflags "-X main.appVersion=${{ steps.version.outputs.value }}" -o "$GITHUB_WORKSPACE/dist/bin/wail.exe" .

      - name: ccache stats
        if: always()
        shell: bash
        run: command -v ccache >/dev/null 2>&1 && ccache -s || echo "ccache not installed"

      - name: Stage release artifacts
        shell: bash
        run: |
          # opus is linked statically into wail.exe (x64-mingw-static), but the
          # exe is built with MinGW GCC against a dynamic libstdc++, so it needs
          # the GCC/C++ runtime DLLs at launch. Ship them from the same toolchain
          # that built the exe (C:\mingw64).
          cp /c/mingw64/bin/libstdc++-6.dll dist/bin/
          cp /c/mingw64/bin/libgcc_s_seh-1.dll dist/bin/
          cp /c/mingw64/bin/libwinpthread-1.dll dist/bin/
          cat > dist/README.txt <<'EOF'
          WAIL — WAN Audio Interchange for Link

          Run:
            bin\wail.exe

          Note: this binary is unsigned. If Windows SmartScreen blocks
          launch, click "More info" then "Run anyway".

          Documentation: https://github.com/MostDistant/WAIL
          EOF

      - name: Build & stage CLAP plugins
        shell: bash
        # Bundle the Link Bridge CLAP plugins under dist/lib so the app's
        # first-launch auto-installer (FindPluginDir → {exe}/../lib) finds them.
        run: |
          cmake -S plugins -B build/plugins
          cmake --build build/plugins --config Release
          mkdir -p dist/lib
          # Product bundles only — dev tools (transport-probe, linkbridge-spike) are
          # built but never shipped. MSVC's multi-config generator places the .clap
          # DLLs under build/plugins/Release/ (single-config puts them in
          # build/plugins/) — pick explicitly; we pass --config Release, so the two
          # layouts are deterministic (find -maxdepth missed the DLLs on the Git
          # Bash runner; the missing-bundle guard below caught it loudly).
          src="build/plugins"
          if [ -d "build/plugins/Release" ]; then src="build/plugins/Release"; fi
          for b in wail-linkbridge-send wail-linkbridge-recv; do
            cp -R "${src}/${b}.clap" dist/lib/
          done
          # Fail loudly: a failed platform doesn't block the release by design,
          # so silent plugin-less installers ship unless staging itself errors.
          for b in wail-linkbridge-send wail-linkbridge-recv; do
            test -e "dist/lib/${b}.clap" || { echo "::error::missing staged bundle ${b}.clap"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: wail-release-windows
          path: dist\

  build-linux:
    runs-on: ubuntu-22.04
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: wail-app/go.mod
          # Both Go modules live in subdirs, so point the built-in cache at every
          # go.sum — otherwise setup-go looks only at the repo root and warns.
          cache-dependency-path: "**/go.sum"

      # Reuse the heavy CGo C++ (Ableton Link + asio) compile across runs, even
      # when GOCACHE misses. Routed in via CC/CXX on the build step below.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        continue-on-error: true
        with:
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 500M

      # cgo uses ccache only if it actually installed; otherwise CC/CXX stay
      # unset and cgo falls back to the default gcc/g++ (slower, but still green).
      # The action downloads a binary each run, so a network blip must not fail CI.
      - name: Enable ccache for cgo if available
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "CC=ccache gcc" >> "$GITHUB_ENV"
            echo "CXX=ccache g++" >> "$GITHUB_ENV"
            echo "cgo will use ccache"
          else
            echo "ccache unavailable — building without compiler cache"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libopus-dev \
            libgl-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            cmake \
            g++

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build wail desktop app
        run: go build -tags nolibopusfile -ldflags "-X main.appVersion=${{ steps.version.outputs.value }}" -o "$GITHUB_WORKSPACE/dist/bin/wail" .
        working-directory: wail-app

      - name: ccache stats
        if: always()
        shell: bash
        run: command -v ccache >/dev/null 2>&1 && ccache -s || echo "ccache not installed"

      - name: Stage release artifacts
        run: |
          cat > dist/README.txt <<'EOF'
          WAIL — WAN Audio Interchange for Link

          Runtime dependencies (Debian/Ubuntu):
            sudo apt install libwebkit2gtk-4.1-0 libopus0

          Run:
            ./bin/wail

          Documentation: https://github.com/MostDistant/WAIL
          EOF

      - name: Build & stage CLAP plugins
        # Bundle the Link Bridge CLAP plugins under dist/lib so the app's
        # first-launch auto-installer (FindPluginDir → {exe}/../lib) finds them.
        run: |
          cmake -S plugins -B build/plugins -DCMAKE_BUILD_TYPE=Release
          cmake --build build/plugins
          mkdir -p dist/lib
          # Product bundles only — dev tools (transport-probe, linkbridge-spike) are
          # built but never shipped.
          for b in wail-linkbridge-send wail-linkbridge-recv; do
            cp -R "build/plugins/${b}.clap" dist/lib/
          done

      - uses: actions/upload-artifact@v7
        with:
          name: wail-release-linux
          path: dist/

  create-release:
    needs: [build-windows, build-linux, build-homebrew-tarball]
    # A failed platform build must not sink the whole release: run whenever at
    # least one artifact source succeeded and upload what exists (e.g. a
    # mac-only release is the Homebrew source tarball when Windows/Linux fail).
    # The run still reports failure overall, so a missing platform is visible.
    if: always() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-homebrew-tarball.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: source
          sparse-checkout: homebrew

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package platform artifacts
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # Windows: zip, with a top-level wail-<version>/ directory inside.
          # Skipped when its build job failed — the release ships without it.
          if [ -d wail-release-windows ]; then
            mv wail-release-windows "wail-${VERSION}"
            zip -r "wail-windows-x64-${VERSION}.zip" "wail-${VERSION}"
            mv "wail-${VERSION}" wail-release-windows
          else
            echo "::warning::no Windows artifact — releasing without it"
          fi
          # Linux: tarball, same top-level directory layout.
          if [ -d wail-release-linux ]; then
            mv wail-release-linux "wail-${VERSION}"
            tar -czf "wail-linux-x64-${VERSION}.tar.gz" "wail-${VERSION}"
            mv "wail-${VERSION}" wail-release-linux
          else
            echo "::warning::no Linux artifact — releasing without it"
          fi

      - name: Find individual installers
        id: files
        run: |
          echo "src_tarball=$(ls wail-homebrew-src/wail-*-src.tar.gz 2>/dev/null | head -1 || true)" >> "$GITHUB_OUTPUT"
          echo "windows_zip=$(ls wail-windows-x64-*.zip 2>/dev/null | head -1 || true)" >> "$GITHUB_OUTPUT"
          echo "linux_tarball=$(ls wail-linux-x64-*.tar.gz 2>/dev/null | head -1 || true)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            ${{ steps.files.outputs.src_tarball }}
            ${{ steps.files.outputs.windows_zip }}
            ${{ steps.files.outputs.linux_tarball }}

      # Update the Homebrew tap formula with the new version and SHA256.
      # Requires a HOMEBREW_TAP_TOKEN secret with push access to MostDistant/homebrew-wail.
      # If the secret is not configured, this step is skipped gracefully.
      - name: Update Homebrew tap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -z "${GH_TOKEN}" ] && echo "HOMEBREW_TAP_TOKEN not set, skipping tap update." && exit 0
          ls wail-homebrew-src/wail-*-src.tar.gz.sha256 >/dev/null 2>&1 || { echo "no source tarball artifact, skipping tap update."; exit 0; }
          VERSION="${{ steps.tag.outputs.version }}"
          SHA=$(cat wail-homebrew-src/wail-*-src.tar.gz.sha256 | head -1)
          URL="https://github.com/MostDistant/WAIL/releases/download/v${VERSION}/wail-${VERSION}-src.tar.gz"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/MostDistant/homebrew-wail.git" tap
          # Copy full formula from source so all formula changes are deployed
          cp source/homebrew/wail.rb tap/Formula/wail.rb
          # Patch URL and SHA for this release
          sed -i \
            "s|url \".*\"|url \"${URL}\"|" \
            tap/Formula/wail.rb
          sed -i \
            "s|sha256 \".*\"|sha256 \"${SHA}\"|" \
            tap/Formula/wail.rb
          cd tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "Update wail to v${VERSION}"
          git push
