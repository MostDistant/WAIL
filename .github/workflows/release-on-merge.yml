name: Release on Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install knope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL "https://github.com/knope-dev/knope/releases/latest/download/knope-x86_64-unknown-linux-musl.tgz" \
            | tar -xz --strip-components=1 -C /usr/local/bin/

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release

      # Reset the beta branch to the just-released main (docs/adr/0008). Within a
      # cycle main never touches VERSION/CHANGELOG, so beta.yml's merge stays
      # conflict-free; a stable release moves both, so beta must return to main
      # before the next beta or every subsequent merge conflicts. Also re-seeds
      # knope from the fresh stable VERSION, so the next cycle's beta.1 numbers
      # itself. beta.yml recreates the branch on its next run if this races.
      - name: Reset beta branch to main
        run: |
          git fetch origin main
          git push origin origin/main:refs/heads/beta --force

      - name: Trigger release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          echo "Triggering release build for ${TAG}"
          gh workflow run release.yml --ref "${TAG}" -f tag="${TAG}"

      - name: Delete release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/git/refs/heads/release -X DELETE || true
