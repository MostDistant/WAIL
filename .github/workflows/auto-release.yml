name: Prepare Release

on:
  push:
    branches: [main]

concurrency:
  group: prepare-release
  cancel-in-progress: true

jobs:
  prepare-release:
    # Skip if this push is the release PR being merged
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install knope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSfL "https://github.com/knope-dev/knope/releases/latest/download/knope-x86_64-unknown-linux-musl.tgz" \
            | tar -xz --strip-components=1 -C /usr/local/bin/

      - name: Ensure changeset exists for patch release
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          HAS_CHANGESETS=false
          HAS_CONVENTIONAL=false

          if ls .changeset/*.md 1>/dev/null 2>&1; then
            HAS_CHANGESETS=true
          fi

          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          # NOTE: keep this regex aligned with what knope actually bumps on
          # (stock config: feat!/feat/fix!/fix only). refactor/perf used to be
          # listed here, which skipped the fallback changeset and then failed
          # knope prepare-release with "No packages are ready to release".
          if git log --oneline "$RANGE" | grep -qE '^[0-9a-f]+ (feat|fix|feat!|fix!)[(:!]'; then
            HAS_CONVENTIONAL=true
          fi

          if [ "$HAS_CHANGESETS" = false ] && [ "$HAS_CONVENTIONAL" = false ]; then
            echo "No changesets or conventional commits found. Creating fallback patch changeset."
            mkdir -p .changeset
            COMMIT_MSG=$(git log -1 --format='%s')
            printf -- '---\ndefault: patch\n---\n\n%s\n' "$COMMIT_MSG" > .changeset/auto-patch.md
          fi

      - name: Run knope prepare-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope prepare-release

      - name: Create or update release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          EXISTING_PR=$(gh pr list --head release --base main --json number --jq '.[0].number' 2>/dev/null || echo "")

          # Betas for this cycle are exactly v<stable>-beta.* (docs/adr/0008).
          # Listing them lets you confirm at merge time that the beta you
          # actually tested is the newest one — promotion is by judgment, not a
          # gate, so this is the only "did I ship what was tested" signal.
          git fetch --tags origin >/dev/null 2>&1 || true
          BETAS=$(git tag --list "v${VERSION}-beta.*" --sort=v:refname | tr '\n' ' ' | sed 's/ $//')
          [ -z "$BETAS" ] && BETAS="(none — no betas cut this cycle)"

          BODY="Automated release preparation for v${VERSION}.

          Merging this PR will create GitHub release v${VERSION} and trigger artifact builds.

          Betas soaked this cycle: ${BETAS}"

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "chore: prepare release v${VERSION}" \
              --body "$BODY"
            echo "Updated existing PR #${EXISTING_PR}"
          else
            gh pr create \
              --head release \
              --base main \
              --title "chore: prepare release v${VERSION}" \
              --body "$BODY"
          fi
