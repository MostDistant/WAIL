name: Build

on:
  push:
    branches: [main, "claude/**"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: prepare release')"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: wail-app/go.mod

      - name: Install opus
        run: brew install opus

      - name: Build Go app
        # nolibopusfile suppresses unused stream.go in gopkg.in/hraban/opus.v2,
        # which would otherwise require libopusfile to be installed.
        run: go build -tags nolibopusfile -o /dev/null .
        working-directory: wail-app

      - name: Test Go app
        run: go test -tags nolibopusfile ./...
        working-directory: wail-app

      - name: Build & test signaling-server
        run: go build ./... && go test ./...
        working-directory: signaling-server

