name: Build

on:
  push:
    branches: [main, "claude/**"]
  # Without this, nothing here ran before a merge — the Linux plugin job in
  # particular, which is the only place a glibc-only build break can surface.
  # One did (the dladdr fix in this PR): green on macOS, green through review,
  # red the moment it landed on main.
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # ref_name, not ref, so a push to claude/** and the pull request from that
  # same branch land in one group and the duplicate is cancelled rather than
  # run twice: push gives refs/heads/claude/x where the PR gives claude/x.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    # head_commit exists only on push; on a pull request it is null and the
    # expression would rely on null-coercion to keep the job running. Say it
    # outright instead — the skip is about release-prep pushes to main.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: prepare release')
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: wail-app/go.mod
          # Both Go modules live in subdirs, so point the built-in cache at every
          # go.sum — otherwise setup-go looks only at the repo root and warns.
          cache-dependency-path: "**/go.sum"

      - name: Install opus
        run: brew install opus

      - name: Build Go app
        # nolibopusfile suppresses unused stream.go in gopkg.in/hraban/opus.v2,
        # which would otherwise require libopusfile to be installed.
        run: go build -tags nolibopusfile -o /dev/null .
        working-directory: wail-app

      - name: Test Go app
        run: go test -tags nolibopusfile ./...
        working-directory: wail-app

      - name: Build CLAP plugins
        run: |
          cmake -S plugins -B build/plugins -DCMAKE_BUILD_TYPE=Release -DWAIL_PLUGIN_TESTS=ON
          cmake --build build/plugins
          ctest --test-dir build/plugins --output-on-failure --repeat until-pass:3

      - name: Build & test signaling-server
        run: go build ./... && go test ./...
        working-directory: signaling-server

  build-windows:
    # Pinned to windows-2022 to match the release workflow's toolchain (older
    # MinGW GCC + CMake). windows-latest rolled over to the 2025/2026 image
    # whose newer toolchain breaks the CGo builds. See #329.
    runs-on: windows-2022
    # head_commit exists only on push; on a pull request it is null and the
    # expression would rely on null-coercion to keep the job running. Say it
    # outright instead — the skip is about release-prep pushes to main.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: prepare release')
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: wail-app/go.mod
          # Both Go modules live in subdirs, so point the built-in cache at every
          # go.sum — otherwise setup-go looks only at the repo root and warns.
          cache-dependency-path: "**/go.sum"

      # Reuse the heavy CGo C++ (Ableton Link + asio) compile across runs, even
      # when GOCACHE misses. Routed in via CC/CXX on the build step below.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        continue-on-error: true
        with:
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 500M

      # cgo uses ccache only if it actually installed; otherwise CC/CXX stay
      # unset and cgo falls back to the default gcc/g++ (slower, but still green).
      # The action downloads a binary each run, so a network blip must not fail CI.
      - name: Enable ccache for cgo if available
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "CC=ccache gcc" >> "$GITHUB_ENV"
            echo "CXX=ccache g++" >> "$GITHUB_ENV"
            echo "cgo will use ccache"
          else
            echo "ccache unavailable — building without compiler cache"
          fi

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          # Exact key; bump the suffix when the package list changes. restore-keys
          # falls back to the newest prior cache on a miss, and the install step
          # below still re-runs on a non-exact hit (its `if` checks the exact key).
          key: vcpkg-opus-mingw-static-pkgconf-x64-windows-v5
          restore-keys: |
            vcpkg-opus-mingw-static-pkgconf-x64-windows-

      - name: Install opus + pkgconf via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        # pkgconf is a drop-in pkg-config that the Go/CGo build needs to locate
        # opus. We get it from vcpkg rather than choco because the choco
        # community feed is flaky (504s) and silently leaves the build to fall
        # back to Strawberry Perl's broken pkg-config.bat stub on PATH.
        #
        # opus is built for the x64-mingw-static triplet (same GCC ABI as the
        # CGo objects) and linked statically into the desktop-app binary.
        run: vcpkg install opus:x64-mingw-static pkgconf:x64-windows

      - name: Configure pkg-config
        shell: pwsh
        # Point CGo straight at the vcpkg pkgconf binary by absolute path via
        # PKG_CONFIG, so PATH lookup (and Strawberry Perl's pkg-config.bat stub)
        # is bypassed entirely for every later step in this job.
        run: |
          $pkgconf = Get-ChildItem C:\vcpkg\installed\x64-windows -Recurse -Filter pkgconf.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkgconf) { throw "pkgconf.exe not found under vcpkg (did the install step run?)" }
          "PKG_CONFIG=$($pkgconf.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using PKG_CONFIG=$($pkgconf.FullName)"
          & $pkgconf.FullName --version

      - name: Rename Link `interface` param for MinGW
        shell: pwsh
        # MinGW's COM headers #define `interface`, colliding with the `interface`
        # parameter in Link's link_audio/Channels.hpp. Rename it (the only
        # identifier use — Interface/mpInterface are untouched; other files use
        # the word only in a comment/string). Undef-ing the macro from our cgo
        # wrapper proved unreliable on MinGW.
        # -creplace is case-SENSITIVE: rename only lowercase `interface`, never the
        # `Interface` template parameter (PowerShell's -replace is case-insensitive
        # and would collapse both into `iface`, shadowing the template param).
        run: |
          (Get-Content vendor/link/include/ableton/link_audio/Channels.hpp) `
            -creplace '\binterface\b', 'iface' `
            | Set-Content vendor/link/include/ableton/link_audio/Channels.hpp

      - name: Build Go app
        env:
          PKG_CONFIG_PATH: C:\vcpkg\installed\x64-mingw-static\lib\pkgconfig
        run: go build -tags nolibopusfile -o NUL .
        working-directory: wail-app

      - name: Build CLAP plugins
        run: |
          cmake -S plugins -B build/plugins -DWAIL_PLUGIN_TESTS=ON
          cmake --build build/plugins --config Release
          ctest --test-dir build/plugins -C Release --output-on-failure --repeat until-pass:3

      - name: ccache stats
        if: always()
        shell: bash
        run: command -v ccache >/dev/null 2>&1 && ccache -s || echo "ccache not installed"

      - name: Build & test signaling-server
        run: go build ./... && go test ./...
        working-directory: signaling-server

  build-linux:
    runs-on: ubuntu-22.04
    # head_commit exists only on push; on a pull request it is null and the
    # expression would rely on null-coercion to keep the job running. Say it
    # outright instead — the skip is about release-prep pushes to main.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: prepare release')
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: wail-app/go.mod
          # Both Go modules live in subdirs, so point the built-in cache at every
          # go.sum — otherwise setup-go looks only at the repo root and warns.
          cache-dependency-path: "**/go.sum"

      # Reuse the heavy CGo C++ (Ableton Link + asio) compile across runs, even
      # when GOCACHE misses. Routed in via CC/CXX on the build/test steps below.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        continue-on-error: true
        with:
          key: ${{ github.job }}-${{ runner.os }}
          max-size: 500M

      # cgo uses ccache only if it actually installed; otherwise CC/CXX stay
      # unset and cgo falls back to the default gcc/g++ (slower, but still green).
      # The action downloads a binary each run, so a network blip must not fail CI.
      - name: Enable ccache for cgo if available
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "CC=ccache gcc" >> "$GITHUB_ENV"
            echo "CXX=ccache g++" >> "$GITHUB_ENV"
            echo "cgo will use ccache"
          else
            echo "ccache unavailable — building without compiler cache"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libopus-dev \
            libgl-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            cmake \
            g++

      - name: Build Go app
        run: go build -tags nolibopusfile -o /dev/null .
        working-directory: wail-app

      - name: Test Go app
        run: go test -tags nolibopusfile ./...
        working-directory: wail-app

      - name: Build CLAP plugins
        run: |
          cmake -S plugins -B build/plugins -DCMAKE_BUILD_TYPE=Release -DWAIL_PLUGIN_TESTS=ON
          cmake --build build/plugins
          ctest --test-dir build/plugins --output-on-failure --repeat until-pass:3

      - name: ccache stats
        if: always()
        shell: bash
        run: command -v ccache >/dev/null 2>&1 && ccache -s || echo "ccache not installed"

      - name: Build & test signaling-server
        run: go build ./... && go test ./...
        working-directory: signaling-server
