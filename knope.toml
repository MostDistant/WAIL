[package]
# VERSION is a plain-text semver file (not a format knope recognizes by name),
# so we point knope at it with a regex whose `version` capture group it bumps.
versioned_files = [{ path = "VERSION", regex = "(?<version>\\d+\\.\\d+\\.\\d+)" }]
changelog = "CHANGELOG.md"

[github]
owner = "MostDistant"
repo = "WAIL"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "Command"
command = "git add ."

[[workflows.steps]]
type = "Command"
command = "git commit -m 'chore: prepare release'"

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
