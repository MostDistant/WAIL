[package]
# VERSION is a plain-text semver file (not a format knope recognizes by name),
# so we point knope at it with a regex whose `version` capture group it bumps.
# The optional prerelease suffix is load-bearing for the beta channel: knope
# re-reads the version through this regex, so without it a beta branch sitting
# at 4.2.0-beta.3 reads back as 4.2.0 and regenerates beta.0 forever.
versioned_files = [{ path = "VERSION", regex = "(?<version>\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?)" }]
changelog = "CHANGELOG.md"

[github]
owner = "MostDistant"
repo = "WAIL"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "Command"
command = "git add ."

[[workflows.steps]]
type = "Command"
command = "git commit -m 'chore: prepare release'"

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

# The beta channel (docs/adr/0008): every merge to main becomes a prerelease on
# the long-lived `beta` branch. No `git switch` here — beta.yml checks the
# branch out and merges main before calling this, and pushes/tags afterwards.
[[workflows]]
name = "prepare-beta"

[[workflows.steps]]
type = "PrepareRelease"
prerelease_label = "beta"

[[workflows.steps]]
type = "Command"
command = "git add ."

# Must not read "chore: prepare release" — that string is the skip guard the
# stable workflows match on.
[[workflows.steps]]
type = "Command"
command = "git commit -m 'chore: beta build'"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
